plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.lite.tvlauncher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.lite.tvlauncher'
        minSdk 21      // Android TV starts at 5.0. Tell me if your TV is older.
        targetSdk 28   // low target = fewer behaviour changes on old TVs
        versionCode 1; versionName '1.0'
    }
    buildTypes { release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
// No third-party dependencies on purpose.
